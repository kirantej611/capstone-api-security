version: '3.8'

services:
  # Message Broker
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # In-memory Store (Blocklists, Rate Limiting)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # Database (Alerts, Metrics, Users)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: capstone_db
    ports:
      - "5432:5432"
    volumes:
      - ./victim-ecommerce/db/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── Victim E-Commerce Backend (The "Target") ──
  # Published on loopback only so the local shield-vs-direct demo can reach it
  # from the host browser. It is not bound on all interfaces.
  victim-ecommerce:
    build: ./victim-ecommerce
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: password
      DATABASE_NAME: victim_ecommerce_db
      MAINTENANCE_DB: postgres
      JWT_SECRET: super-secret-key-123
      VULN_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── API Gateway (The "Shield") ──
  # Public entry point on port 8080 — all traffic flows through here
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      UPSTREAM_BASE_URL: "http://victim-ecommerce:8081"
      ML_ENGINE_URL: "http://ml-engine:8001"
      ML_ENGINE_TIMEOUT: "5.0"
      REDIS_URL: "redis://redis:6379/0"
      BLOCKLIST_TTL: "3600"
      RATE_LIMIT_WINDOW: "60"
      RATE_LIMIT_MAX_REQUESTS: "100"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_TOPIC_REQUESTS: "api.requests.raw"
      KAFKA_TOPIC_VERDICTS: "api.verdicts"
      BLOCK_ON_ML_FAILURE: "false"
      RISK_THRESHOLD_BLOCK: "HIGH"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      victim-ecommerce:
        condition: service_started
      ml-engine:
        condition: service_started
    restart: unless-stopped

  # ── ML Intelligence Engine (PyTorch + Scikit-Learn) ──
  # Real-time anomaly detection and attack classification
  ml-engine:
    build: ./ml-engine
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
    restart: unless-stopped

  # ── Security Backend / Risk Engine (Go) ──
  # Consumes ML predictions from Kafka, scores IPs, blocks threats, serves alerts API
  security-backend:
    build: ./security-backend
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: "api.verdicts"
      REDIS_ADDR: "redis:6379"
      POSTGRES_URL: "postgres://admin:password@postgres:5432/capstone_db?sslmode=disable"
      BLOCK_THRESHOLD: "80.0"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_started
    restart: unless-stopped

  # ── Security Dashboard (Next.js React Frontend) ──
  # Real-time monitoring UI with interactive attack simulator
  security-dashboard:
    build: ./security-dashboard
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_GATEWAY_URL: "http://localhost:8080"
      NEXT_PUBLIC_VICTIM_URL: "http://localhost:8081"
      NEXT_PUBLIC_SECURITY_BACKEND_URL: "http://localhost:8082"
    depends_on:
      - api-gateway
      - security-backend
    restart: unless-stopped
