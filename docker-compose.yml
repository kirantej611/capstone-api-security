version: '3.8'

services:
  # Message Broker
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # In-memory Store (Blocklists, Rate Limiting)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # Database (Alerts, Metrics, Users)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: capstone_db
    ports:
      - "5432:5432"
    volumes:
      - ./victim-ecommerce/db/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh

  # Define your custom services here in future phases
  # e.g., api-gateway, ml-engine, etc.
  
  victim-ecommerce:
    build: ./victim-ecommerce
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: password
      DATABASE_NAME: victim_ecommerce_db
      MAINTENANCE_DB: postgres
      JWT_SECRET: super-secret-key-123
      VULN_MODE: "true"
    depends_on:
      - postgres
      - redis
