version: '3.8'

services:
  # Message Broker
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # In-memory Store (Blocklists, Rate Limiting)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # Database (Alerts, Metrics, Users)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: capstone_db
    ports:
      - "5432:5432"
    volumes:
      - ./victim-ecommerce/db/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh

  # ── Victim E-Commerce Backend (The "Target") ──
  # Runs on port 8081 BEHIND the API Gateway (not exposed publicly)
  victim-ecommerce:
    build: ./victim-ecommerce
    ports:
      - "8081:8081"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: admin
      DATABASE_PASSWORD: password
      DATABASE_NAME: victim_ecommerce_db
      MAINTENANCE_DB: postgres
      JWT_SECRET: super-secret-key-123
      VULN_MODE: "true"
    depends_on:
      - postgres
      - redis

  # ── API Gateway (The "Shield") ──
  # Public entry point on port 8080 — all traffic flows through here
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      UPSTREAM_BASE_URL: "http://victim-ecommerce:8081"
      ML_ENGINE_URL: "http://ml-engine:8000"
      ML_ENGINE_TIMEOUT: "5.0"
      REDIS_URL: "redis://redis:6379/0"
      BLOCKLIST_TTL: "3600"
      RATE_LIMIT_WINDOW: "60"
      RATE_LIMIT_MAX_REQUESTS: "100"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_TOPIC_REQUESTS: "api.requests.raw"
      KAFKA_TOPIC_VERDICTS: "api.verdicts"
      BLOCK_ON_ML_FAILURE: "false"
      RISK_THRESHOLD_BLOCK: "HIGH"
    depends_on:
      - redis
      - kafka
      - victim-ecommerce
    restart: unless-stopped

  # ── Security Backend / Risk Engine (Go) ──
  # Consumes ML predictions from Kafka, scores IPs, blocks threats, serves alerts API
  security-backend:
    build: ./security-backend
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: "api.verdicts"
      REDIS_ADDR: "redis:6379"
      POSTGRES_URL: "postgres://admin:password@postgres:5432/capstone_db?sslmode=disable"
      BLOCK_THRESHOLD: "80.0"
    depends_on:
      - kafka
      - redis
      - postgres
    restart: unless-stopped

  # Define additional custom services here in future phases
  # e.g., ml-engine, security-dashboard, etc.
